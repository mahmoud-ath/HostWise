[package]
name = "hostwise"
version = "0.8.3"
description = "HostWise — vacation rental financial intelligence (desktop shell)"
authors = ["HostWise"]
edition = "2021"
rust-version = "1.77.2"

# The app's Rust library exposes the Tauri app; the binary is a thin wrapper.
[lib]
name = "hostwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostwise-backend = { path = "../../backend" }
anyhow = "1"
axum = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[profile.release]
panic = "abort"
# Less aggressive packaging: keep symbols (no full strip) and use thin LTO so
# the resulting binary does not resemble packed/obfuscated malware — reduces
# Windows Defender / SmartScreen false positives on unsigned builds.
codegen-units = 1
lto = "thin"
opt-level = 2
