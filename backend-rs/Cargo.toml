[package]
name = "hostwise-backend"
version = "0.7.1"
edition = "2021"
description = "HostWise native backend (Rust) — replaces the Python/FastAPI backend"
license = "MIT"

[[bin]]
name = "hostwise-backend"
path = "src/main.rs"

[lib]
name = "hostwise_backend"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dotenvy = "0.15"
jsonwebtoken = "9"
printpdf = "0.6"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
