name: Build macOS

# Legacy per-OS build (manual only). Releases are now produced by the
# consolidated production pipeline: .github/workflows/release.yml.
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      - name: Build Tauri .dmg
        working-directory: frontend
        run: bunx tauri build --bundles dmg

      # Signing + notarization require Apple Developer certificates. Uncomment
      # once you have them and add the secrets:
      # - name: Sign
      #   run: |
      #     bunx tauri build --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"${{ secrets.MAC_SIGN_IDENTITY }}","entitlements":"entitlements.plist"}}}'
      # - name: Notarize
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: xcrun notarytool submit --wait --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" frontend/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
