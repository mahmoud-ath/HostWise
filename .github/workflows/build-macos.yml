name: Build macOS

# Build the HostWise .dmg for macOS (Apple Silicon + Intel universal if
# building on a universal setup; GitHub runners are arm64 by default).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      - name: Build Tauri .dmg
        working-directory: frontend
        run: bunx tauri build --bundles dmg

      # Signing + notarization require Apple Developer certificates. Uncomment
      # once you have them and add the secrets:
      # - name: Sign
      #   run: |
      #     bunx tauri build --bundles dmg --config '{"bundle":{"macOS":{"signingIdentity":"${{ secrets.MAC_SIGN_IDENTITY }}","entitlements":"entitlements.plist"}}}'
      # - name: Notarize
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: xcrun notarytool submit --wait --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" frontend/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
