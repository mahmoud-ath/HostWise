# ═══════════════════════════════════════════════════════════
# HostWise — Release Dispatcher
# ═══════════════════════════════════════════════════════════
# Manual trigger only. Pushes a tag matching one of the
# patterns below to trigger the OS-specific workflow directly:
#   v0.4.2-linux  → release-linux.yml
#   v0.4.2-win    → release-windows.yml
#   v0.4.2-macos  → release-macos.yml
# ═══════════════════════════════════════════════════════════

name: Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target OS to build
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
          - macos

jobs:
  dispatch:
    name: Dispatch ${{ inputs.os }} release
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger ${{ inputs.os }} workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW="release-${{ inputs.os }}.yml"
          echo "Dispatching $WORKFLOW on ${{ github.ref_name }} ..."
          gh workflow run "$WORKFLOW" --ref "${{ github.ref }}"
