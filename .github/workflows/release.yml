# ═══════════════════════════════════════════════════════════
# HostWise — Release Pipeline
# ═══════════════════════════════════════════════════════════
# Builds Tauri desktop app (with embedded Python backend)
# on Linux, Windows, and macOS when a version tag is pushed.
# Creates a GitHub Release with all artifacts.
# ═══════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Linux Build ────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            file

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"

      - name: Configure Tauri for production
        run: |
          python3 -c "
          import json
          with open('frontend/src-tauri/tauri.conf.json') as f:
              cfg = json.load(f)
          bundle = cfg.setdefault('bundle', {})
          bundle['externalBin'] = ['binaries/hostwise-backend']
          bundle['resources'] = ['binaries/*']
          # Disable updater artifacts for CI
          cfg['bundle']['createUpdaterArtifacts'] = False
          with open('frontend/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri
        run: |
          cd frontend
          bun run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux
          path: |
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.rpm
            frontend/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn

  # ── Windows Build ──────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        shell: pwsh
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -q -r requirements.txt pyinstaller
          pyinstaller --onefile --name hostwise-backend `
            --add-data "app;app" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=aiosqlite `
            --hidden-import=sqlalchemy.dialects.sqlite `
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --collect-all app `
            --collect-all aiosqlite `
            --noconsole `
            launcher.py

      - name: Prepare backend binary for Tauri
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s+", "" }).Trim()
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe "frontend\src-tauri\binaries\hostwise-backend-${TargetTriple}.exe"

      - name: Configure Tauri for production
        shell: pwsh
        run: |
          $cfg = Get-Content frontend\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name externalBin -Value @("binaries/hostwise-backend")
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name resources -Value @("binaries/*")
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name createUpdaterArtifacts -Value $false
          $cfg | ConvertTo-Json -Depth 10 | Set-Content frontend\src-tauri\tauri.conf.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri
        run: |
          cd frontend
          bun run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: |
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

  # ── macOS Build ────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"

      - name: Configure Tauri for production
        run: |
          python3 -c "
          import json
          with open('frontend/src-tauri/tauri.conf.json') as f:
              cfg = json.load(f)
          bundle = cfg.setdefault('bundle', {})
          bundle['externalBin'] = ['binaries/hostwise-backend']
          bundle['resources'] = ['binaries/*']
          cfg['bundle']['createUpdaterArtifacts'] = False
          with open('frontend/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (${{ matrix.target }})
        run: |
          cd frontend
          bun run tauri build --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos-${{ matrix.target }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
          if-no-files-found: warn

  # ── GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cat > release-notes.md << EOF
          ## HostWise v${VERSION}

          ### 📦 Downloads

          EOF

          echo "### Linux" >> release-notes.md
          for f in artifacts/hostwise-linux/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`${name}\` (${size})" >> release-notes.md
          done

          echo "" >> release-notes.md
          echo "### Windows" >> release-notes.md
          for f in artifacts/hostwise-windows/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`${name}\` (${size})" >> release-notes.md
          done

          echo "" >> release-notes.md
          echo "### macOS" >> release-notes.md
          for d in artifacts/hostwise-macos-*; do
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              echo "- \`${name}\` (${size})" >> release-notes.md
            done
          done

          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/hostwise-linux/*
            artifacts/hostwise-windows/*
            artifacts/hostwise-macos-*/*
          fail_on_unmatched_files: false
