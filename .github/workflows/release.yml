# ═══════════════════════════════════════════════════════════════════════
# HostWise — Production Release Pipeline
# ═══════════════════════════════════════════════════════════════════════
# Builds the desktop app for Windows (NSIS), macOS (dmg) and Linux (deb +
# AppImage best-effort), then publishes installers to a GitHub Release.
#
# Triggered by:
#   - a `v*` tag push  (e.g. `git tag v0.6.3 && git push origin v0.6.3`)
#   - manual dispatch
#
# Design notes:
#   - Each OS is an INDEPENDENT job so one platform failing (e.g. the
#     linuxdeploy AppImage issue) never blocks the others from publishing.
#   - Python is pinned to 3.12 (backend/requirements.txt targets 3.12+; the
#     older 3.10 produced broken `_ssl` under PyInstaller).
#   - PE stripping is disabled inside backend/hostwise-backend.spec
#     (`strip = sys.platform != "win32"`); the MinGW `strip` on the Windows
#     runner corrupts the DLLs -> "Invalid access to memory location".
#   - WeasyPrint is a lazy import in the backend; PDF export degrades
#     gracefully when the GTK/Pango runtime is absent.
# ═══════════════════════════════════════════════════════════════════════

name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows ──────────────────────────────────────────────────────────
  windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: win-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Install backend deps + PyInstaller
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Tauri installer (NSIS)
        working-directory: frontend
        run: bunx tauri build --bundles nsis

      # Optional Windows code signing. Configure the secrets to enable.
      - name: Sign installer (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          Set-Content -Path "$env:RUNNER_TEMP\cert.pfx" -Value $cert -AsByteStream
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            (Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe).FullName
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ── macOS ────────────────────────────────────────────────────────────
  macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: mac-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: mac-cargo-

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Tauri .dmg
        working-directory: frontend
        run: bunx tauri build --bundles dmg

      # Optional notarization. Configure the secrets to enable.
      - name: Notarize (optional)
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          dmg=$(find frontend/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          xcrun notarytool submit "$dmg" --wait --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false

  # ── Linux ────────────────────────────────────────────────────────────
  linux:
    name: Build Linux (deb + AppImage best-effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: lin-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: lin-cargo-

      - name: Install Tauri + WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0 \
            patchelf libfuse2

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Tauri .deb
        working-directory: frontend
        run: bunx tauri build --bundles deb

      # AppImage is currently blocked by an upstream linuxdeploy issue
      # (old strip vs .relr.dyn on Ubuntu 24.04, tauri-apps/tauri#14796).
      # Best effort only — NO_STRIP=true and --verbose; never block the
      # release on it.
      - name: Build Tauri AppImage (best effort)
        working-directory: frontend
        continue-on-error: true
        env:
          NO_STRIP: "true"
        run: bunx tauri build --bundles appimage --verbose

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload AppImage artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-appimage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: false
