# ═══════════════════════════════════════════════════════════
# HostWise — Release Pipeline
# ═══════════════════════════════════════════════════════════
# Builds Tauri desktop app (with embedded Python backend)
# on Linux, Windows, and macOS when a version tag is pushed.
# Creates a GitHub Release with all artifacts.
# ═══════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Linux Build ────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            --noconsole \
            --noupx \
            --strip \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (deb + appimage + rpm)
        run: |
          cd frontend
          bun run tauri build --bundles deb,appimage,rpm

      - name: List bundle contents
        run: |
          echo "=== Linux Bundle ==="
          find frontend/src-tauri/target/release/bundle -type f -ls 2>/dev/null || echo "No bundle files found"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux
          path: frontend/src-tauri/target/release/bundle/
          if-no-files-found: error

  # ── Windows Build ──────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        shell: pwsh
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -q -r requirements.txt pyinstaller
          pyinstaller --onefile --name hostwise-backend `
            --add-data "app;app" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=aiosqlite `
            --hidden-import=sqlalchemy.dialects.sqlite `
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --collect-all app `
            --collect-all aiosqlite `
            --noconsole `
            --noupx `
            --strip `
            --clean `
            launcher.py

      - name: Prepare backend binary for Tauri
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s+", "" }).Trim()
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe "frontend\src-tauri\binaries\hostwise-backend-${TargetTriple}.exe"

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Install WiX toolset (for MSI bundling)
        shell: pwsh
        continue-on-error: true
        run: |
          $wixDir = "$env:ProgramFiles\WiX Toolset v3.14\bin"
          $wixRoot = "$env:ProgramFiles\WiX Toolset v3.14"
          $wixZip = "$env:TEMP\wix314.zip"
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"

          if (-not (Test-Path "$wixDir\candle.exe")) {
            Write-Host "Downloading WiX 3.14..."
            $retries = 0
            $downloaded = $false
            while ($retries -lt 3 -and -not $downloaded) {
              try {
                Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -TimeoutSec 180 -UseBasicParsing
                $downloaded = $true
              } catch {
                $retries++
                Write-Warning "Download failed (attempt $retries/3): $_"
                Start-Sleep -Seconds 15
              }
            }
            if ($downloaded) {
              New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
              Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
              Remove-Item $wixZip -Force
              Write-Host "WiX 3.14 installed to $wixDir"
            } else {
              Write-Warning "Failed to download WiX after 3 attempts"
            }
          } else {
            Write-Host "WiX 3.14 already present at $wixDir"
          }
          # Add to PATH and set WIX env var so Tauri finds it
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Code sign the backend binary (optional)
        shell: pwsh
        continue-on-error: true
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX) {
            Write-Host "No code signing certificate found — skipping (Windows Defender may flag the app)"
            exit 0
          }
          $pfxPath = "$env:TEMP\cert.pfx"
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $exes = @(
            "frontend\src-tauri\target\release\hostwise.exe"
          )
          foreach ($exe in $exes) {
            if (Test-Path $exe) {
              & "signtool" sign /fd SHA256 /a /f $pfxPath /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
              Write-Host "Signed: $exe"
            }
          }

      - name: Build Tauri (msi + nsis)
        shell: pwsh
        run: |
          cd frontend
          if (Get-Command "candle.exe" -ErrorAction SilentlyContinue) {
            Write-Host "WiX found — building MSI + NSIS"
            bun run tauri build --bundles msi,nsis
          } else {
            Write-Warning "WiX not available, falling back to NSIS only"
            bun run tauri build --bundles nsis
          }

      - name: Code sign the installer (optional)
        shell: pwsh
        continue-on-error: true
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX) { exit 0 }
          $pfxPath = "$env:TEMP\cert.pfx"
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $installers = Get-ChildItem -Path frontend\src-tauri\target\release\bundle -Recurse -Include *.msi,*.exe
          foreach ($installer in $installers) {
            & "signtool" sign /fd SHA256 /a /f $pfxPath /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
            Write-Host "Signed: $($installer.FullName)"
          }

      - name: List bundle contents
        shell: pwsh
        run: |
          echo "=== Windows Bundle ==="
          Get-ChildItem -Recurse -Path frontend\src-tauri\target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/
          if-no-files-found: error

  # ── macOS Build ────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            --noconsole \
            --noupx \
            --strip \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (dmg)
        run: |
          cd frontend
          bun run tauri build --bundles dmg --target ${{ matrix.target }}

      - name: List bundle contents
        run: |
          echo "=== macOS Bundle ==="
          find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle" -type f -ls 2>/dev/null || echo "No bundle files found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # ── GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded structure
        run: find artifacts -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NOTES="release-notes.md"

          printf "## HostWise v%s\n\n### 📦 Downloads\n\n" "$VERSION" > "$NOTES"

          printf "### Linux\n" >> "$NOTES"
          find artifacts/hostwise-linux -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort | while read -r f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
          done

          printf "\n### Windows\n" >> "$NOTES"
          find artifacts/hostwise-windows -type f \( -name '*.msi' -o -name '*.exe' \) | sort | while read -r f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
          done

          printf "\n### macOS\n" >> "$NOTES"
          for d in artifacts/hostwise-macos-*; do
            find "$d" -type f \( -name '*.dmg' -o -name '*.app' \) | sort | while read -r f; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
            done
          done

          echo "notes_file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/hostwise-linux/deb/*.deb
            artifacts/hostwise-linux/appimage/*.AppImage
            artifacts/hostwise-linux/rpm/*.rpm
            artifacts/hostwise-windows/msi/*.msi
            artifacts/hostwise-windows/nsis/*.exe
            artifacts/hostwise-macos-*/dmg/*.dmg
          fail_on_unmatched_files: false

  # ── AUR Package (Arch Linux) ──────────────────────────
  publish-aur:
    name: Publish AUR Package
    runs-on: ubuntu-22.04
    needs: [release]
    if: github.repository == 'mahmoud-ath/HostWise'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "No AUR SSH key found — skipping AUR publish"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config

      - name: Clone AUR repository
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi
          git clone ssh://aur@aur.archlinux.org/hostwise-bin.git aur-repo

      - name: Update PKGBUILD with new version
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi

          VERSION="${GITHUB_REF_NAME#v}"
          APPIMAGE_URL="https://github.com/mahmoud-ath/HostWise/releases/download/v${VERSION}/HostWise-x86_64.AppImage"

          cd aur-repo

          # Update PKGBUILD version
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # Update source URL
          sed -i "s|^source=.*|source=(\"hostwise-bin-${VERSION}.AppImage::${APPIMAGE_URL}\")|" PKGBUILD

          # Compute SHA256 of the AppImage
          echo "Downloading AppImage to compute checksum..."
          wget -q "$APPIMAGE_URL" -O "hostwise-bin-${VERSION}.AppImage"
          SHA256=$(sha256sum "hostwise-bin-${VERSION}.AppImage" | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD
          rm "hostwise-bin-${VERSION}.AppImage"

          # Generate .SRCINFO
          makepkg --printsrcinfo > .SRCINFO

          # Commit and push
          git config user.name "HostWise Release Bot"
          git config user.email "bot@hostwise.app"
          git add -A
          git commit -m "chore: bump to v${VERSION}"
          git push origin master
