# ═══════════════════════════════════════════════════════════
# HostWise — Release Pipeline
# ═══════════════════════════════════════════════════════════
# Builds Tauri desktop app (with embedded Python backend)
# on Linux, Windows, and macOS when a version tag is pushed.
# Creates a GitHub Release with all artifacts.
# ═══════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Linux Build ────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          # Also copy to embedded/ so include_bytes! in lib.rs gets the fresh binary
          mkdir -p frontend/src-tauri/embedded
          cp backend/dist/hostwise-backend frontend/src-tauri/embedded/hostwise-backend.bin
          chmod +x frontend/src-tauri/embedded/hostwise-backend.bin

      - name: Configure Tauri for production
        run: |
          python3 -c "
          import json
          with open('frontend/src-tauri/tauri.conf.json') as f:
              cfg = json.load(f)
          bundle = cfg.setdefault('bundle', {})
          bundle['externalBin'] = ['binaries/hostwise-backend']
          bundle['resources'] = ['binaries/*']
          bundle['createUpdaterArtifacts'] = False
          with open('frontend/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (deb + appimage + rpm)
        run: |
          cd frontend
          bun run tauri build --bundles deb,appimage,rpm

      - name: List bundle contents
        run: |
          echo "=== Linux Bundle ==="
          find frontend/src-tauri/target/release/bundle -type f -ls 2>/dev/null || echo "No bundle files found"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux
          path: frontend/src-tauri/target/release/bundle/
          if-no-files-found: error

  # ── Windows Build ──────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        shell: pwsh
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -q -r requirements.txt pyinstaller
          pyinstaller --onefile --name hostwise-backend `
            --add-data "app;app" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=aiosqlite `
            --hidden-import=sqlalchemy.dialects.sqlite `
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --collect-all app `
            --collect-all aiosqlite `
            --noconsole `
            launcher.py

      - name: Prepare backend binary for Tauri
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s+", "" }).Trim()
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe "frontend\src-tauri\binaries\hostwise-backend-${TargetTriple}.exe"
          # Also copy to embedded/ so include_bytes! in lib.rs gets the fresh binary
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\embedded | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe frontend\src-tauri\embedded\hostwise-backend.bin

      - name: Configure Tauri for production
        shell: pwsh
        run: |
          $cfg = Get-Content frontend\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name externalBin -Value @("binaries/hostwise-backend")
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name resources -Value @("binaries/*")
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name createUpdaterArtifacts -Value $false
          $cfg | ConvertTo-Json -Depth 10 | Set-Content frontend\src-tauri\tauri.conf.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Install WiX toolset (for MSI bundling)
        shell: pwsh
        continue-on-error: true
        run: |
          $wixDir = "$env:ProgramFiles\WiX Toolset v3.14\bin"
          $wixRoot = "$env:ProgramFiles\WiX Toolset v3.14"
          $wixZip = "$env:TEMP\wix314.zip"
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"

          if (-not (Test-Path "$wixDir\candle.exe")) {
            Write-Host "Downloading WiX 3.14..."
            $retries = 0
            $downloaded = $false
            while ($retries -lt 3 -and -not $downloaded) {
              try {
                Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -TimeoutSec 180 -UseBasicParsing
                $downloaded = $true
              } catch {
                $retries++
                Write-Warning "Download failed (attempt $retries/3): $_"
                Start-Sleep -Seconds 15
              }
            }
            if ($downloaded) {
              New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
              Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
              Remove-Item $wixZip -Force
              Write-Host "WiX 3.14 installed to $wixDir"
            } else {
              Write-Warning "Failed to download WiX after 3 attempts"
            }
          } else {
            Write-Host "WiX 3.14 already present at $wixDir"
          }
          # Add to PATH and set WIX env var so Tauri finds it
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri (msi + nsis)
        shell: pwsh
        run: |
          cd frontend
          if (Get-Command "candle.exe" -ErrorAction SilentlyContinue) {
            Write-Host "WiX found — building MSI + NSIS"
            bun run tauri build --bundles msi,nsis
          } else {
            Write-Warning "WiX not available, falling back to NSIS only"
            bun run tauri build --bundles nsis
          }

      - name: List bundle contents
        shell: pwsh
        run: |
          echo "=== Windows Bundle ==="
          Get-ChildItem -Recurse -Path frontend\src-tauri\target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/
          if-no-files-found: error

  # ── macOS Build ────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${{ matrix.target }}"

      - name: Configure Tauri for production
        run: |
          python3 -c "
          import json
          with open('frontend/src-tauri/tauri.conf.json') as f:
              cfg = json.load(f)
          bundle = cfg.setdefault('bundle', {})
          bundle['externalBin'] = ['binaries/hostwise-backend']
          bundle['resources'] = ['binaries/*']
          bundle['createUpdaterArtifacts'] = False
          with open('frontend/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (dmg)
        run: |
          cd frontend
          bun run tauri build --bundles dmg --target ${{ matrix.target }}

      - name: List bundle contents
        run: |
          echo "=== macOS Bundle ==="
          find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle" -type f -ls 2>/dev/null || echo "No bundle files found"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # ── GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded structure
        run: find artifacts -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NOTES="release-notes.md"

          printf "## HostWise v%s\n\n### 📦 Downloads\n\n" "$VERSION" > "$NOTES"

          printf "### Linux\n" >> "$NOTES"
          find artifacts/hostwise-linux -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort | while read -r f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
          done

          printf "\n### Windows\n" >> "$NOTES"
          find artifacts/hostwise-windows -type f \( -name '*.msi' -o -name '*.exe' \) | sort | while read -r f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
          done

          printf "\n### macOS\n" >> "$NOTES"
          for d in artifacts/hostwise-macos-*; do
            find "$d" -type f \( -name '*.dmg' -o -name '*.app' \) | sort | while read -r f; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              printf -- "- \`%s\` (%s)\n" "$name" "$size" >> "$NOTES"
            done
          done

          echo "notes_file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/hostwise-linux/deb/*.deb
            artifacts/hostwise-linux/appimage/*.AppImage
            artifacts/hostwise-linux/rpm/*.rpm
            artifacts/hostwise-windows/msi/*.msi
            artifacts/hostwise-windows/nsis/*.exe
            artifacts/hostwise-macos-*/dmg/*.dmg
          fail_on_unmatched_files: false
