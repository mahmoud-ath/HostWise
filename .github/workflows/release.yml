# ═══════════════════════════════════════════════════════════════════════
# HostWise — Production Release Pipeline
# ═══════════════════════════════════════════════════════════════════════
# Builds the desktop app for Windows (NSIS), macOS (dmg) and Linux (deb +
# AppImage), then publishes installers to a GitHub Release.
#
# The backend is 100% native Rust (backend-rs/), embedded in the Tauri app —
# no Python, no PyInstaller, no external runtime. This pipeline only builds
# the Next.js static frontend + the Tauri shell.
#
# Triggered by:
#   - a `v*` tag push  (e.g. `git tag v0.7.0 && git push origin v0.7.0`)
#   - manual dispatch
#
# Design notes:
#   - Each OS is an INDEPENDENT job so one platform failing never blocks the
#     others from publishing.
#   - The Rust backend crate is a path dependency of frontend/src-tauri, so
#     `tauri build` compiles it automatically (no separate build step).
#   - The AppImage is repacked after building to use the SYSTEM WebKitGTK
#     (the bundled CI webkit crashes on real GPUs, WebKit bug #297921).
# ═══════════════════════════════════════════════════════════════════════

name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows ──────────────────────────────────────────────────────────
  windows:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: win-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      # createUpdaterArtifacts:true signs each installer with the Tauri
      # updater key (TAURI_SIGNING_PRIVATE_KEY + PASSWORD) so the built-in
      # updater can verify downloads. Add these two secrets to the repo.
      - name: Build Tauri installer (NSIS)
        working-directory: frontend
        run: bunx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Optional Windows code signing. No-op unless the cert secrets are set.
      # (secrets cannot be referenced in `if:`, so we check them in-script.)
      - name: Sign installer (optional)
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Signing skipped: no certificate configured."
            exit 0
          }
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          Set-Content -Path "$env:RUNNER_TEMP\cert.pfx" -Value $cert -AsByteStream
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            (Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*.exe).FullName
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite: true

  # ── macOS ────────────────────────────────────────────────────────────
  macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: mac-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: mac-cargo-

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Build BOTH the .dmg (manual installs) and the .app bundle — Tauri only
      # generates updater signatures for the .app (the .dmg gets no .sig), so
      # the .app is what the built-in updater needs on macOS.
      - name: Build Tauri .dmg + .app
        working-directory: frontend
        run: bunx tauri build --bundles dmg app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri leaves the .app as a directory; the updater needs it as a signed
      # .app.tar.gz (normally produced by tauri-action). Tar + sign it here so
      # latest.json can serve macOS auto-updates.
      - name: Package + sign macOS .app for updater
        working-directory: frontend
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          app_dir=$(find src-tauri/target/release/bundle -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$app_dir" ]; then
            echo "No .app bundle found; skipping updater package."
            exit 0
          fi
          mkdir -p src-tauri/target/release/bundle/app
          name=$(basename "$app_dir")
          out="src-tauri/target/release/bundle/app/${name}.tar.gz"
          tar -czf "$out" -C "$(dirname "$app_dir")" "$name"
          # Reads TAURI_SIGNING_PRIVATE_KEY / _PASSWORD env vars; writes $out.sig
          bunx tauri signer sign "$out"
          ls -la src-tauri/target/release/bundle/app

      # Optional notarization. No-op unless the Apple secrets are set.
      # (secrets cannot be referenced in `if:`, so we check them in-script.)
      - name: Notarize (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Notarization skipped: Apple credentials not configured."
            exit 0
          fi
          dmg=$(find frontend/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          xcrun notarytool submit "$dmg" --wait --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-macos
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.sig
            frontend/src-tauri/target/release/bundle/app/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/app/*.sig
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.sig
            frontend/src-tauri/target/release/bundle/app/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/app/*.sig
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite: true

  # ── Linux ────────────────────────────────────────────────────────────
  linux:
    name: Build Linux (deb + AppImage best-effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo (target + registry)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: lin-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: lin-cargo-

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
          # FUSE 2 (needed by the AppImage best-effort build) ships as
          # libfuse2 on Ubuntu 22.04 but libfuse2t64 on 24.04+. Try both;
          # never block the .deb release on it.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Tauri .deb
        working-directory: frontend
        run: bunx tauri build --bundles deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The AppImage bundles an OLD WebKitGTK from the CI base image whose web
      # process aborts on many real GPUs ("Could not create default EGL display:
      # EGL_BAD_PARAMETER. Aborting...", WebKit bug #297921). We build it here
      # with NO_STRIP (linuxdeploy's old strip chokes on .relr.dyn, tauri#14796),
      # then REPACK it below to use the SYSTEM webkit2gtk-4.1 instead — exactly
      # like the .deb. The AppImage is a first-class artifact; if it can't be
      # built the workflow FAILS (no more silent green runs without an AppImage).
      - name: Build Tauri AppImage
        working-directory: frontend
        env:
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build --bundles appimage --verbose

      - name: Repack AppImage to use system WebKitGTK
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage produced by tauri build."
            exit 1
          fi
          # Strip the bundled (old, EGL-broken) WebKitGTK + its dep tree so the
          # AppImage runs on the SYSTEM webkit2gtk-4.1/gtk3 (the AUR package
          # declares these as dependencies). Uses appimagetool from the Tauri
          # cache. See scripts/repack-appimage-system-webkit.sh for details.
          ../scripts/repack-appimage-system-webkit.sh "$APPIMAGE"
          # Bytes changed since tauri's original .sig — re-sign the repacked
          # AppImage so latest.json / the built-in updater accept it.
          rm -f "$APPIMAGE.sig"
          bunx tauri signer sign "$APPIMAGE"
          echo "Repacked AppImage:"; ls -la "$APPIMAGE" "$APPIMAGE.sig"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-deb
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/deb/*.sig
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-appimage
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/deb/*.sig
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.sig
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite: true

  # ── Updater manifest (latest.json) ──────────────────────────────────
  # Runs after all three OS jobs: merges their installers + signatures into
  # one bundle dir, generates latest.json (the Tauri updater manifest the
  # app polls at /releases/latest/download/latest.json), and uploads it.
  # Without this the built-in updater finds no manifest and no update is
  # offered. Requires the signing secrets on the repo (same as the build jobs).
  updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Merge installers into one bundle dir
        run: |
          set -e
          mkdir -p bundle/nsis bundle/dmg bundle/app bundle/deb bundle/rpm bundle/appimage
          # upload-artifact@v4 FLATTENS files to the artifact root, so copy
          # every file from each artifact (installer + its .sig) into the
          # matching subdir the manifest generator expects. find-based so it
          # works whether artifacts are nested or flattened.
          find artifacts/hostwise-windows -type f -exec cp -n {} bundle/nsis/ \; 2>/dev/null || true
          # macOS: .dmg (manual) + .app.tar.gz (updater target) go to different dirs.
          find artifacts/hostwise-macos -type f \( -name '*.dmg' -o -name '*.dmg.sig' \) -exec cp -n {} bundle/dmg/ \; 2>/dev/null || true
          find artifacts/hostwise-macos -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec cp -n {} bundle/app/ \; 2>/dev/null || true
          find artifacts/hostwise-linux-deb -type f -exec cp -n {} bundle/deb/ \; 2>/dev/null || true
          find artifacts/hostwise-linux-appimage -type f -exec cp -n {} bundle/appimage/ \; 2>/dev/null || true
          find bundle -type f | sort

      - name: Generate latest.json
        working-directory: frontend
        run: bun scripts/generate-latest-json.mjs --bundle-dir=../bundle --dry-run

      - name: Upload latest.json to release
        run: |
          gh release upload "${{ github.ref_name }}" bundle/latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
