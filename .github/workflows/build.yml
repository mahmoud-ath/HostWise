# ═══════════════════════════════════════════════════════════
# HostWise — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════
# Builds the desktop application on Ubuntu and Windows.
# On version tags, creates a GitHub Release with all artifacts.
# ═══════════════════════════════════════════════════════════

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Ubuntu / Linux Build ───────────────────────────────
  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt pyinstaller
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"

      - name: Configure Tauri for production
        run: |
          python3 -c "
          import json
          with open('frontend/src-tauri/tauri.conf.json') as f:
              cfg = json.load(f)
          bundle = cfg.setdefault('bundle', {})
          bundle['externalBin'] = ['binaries/hostwise-backend']
          bundle['resources'] = ['binaries/*']
          with open('frontend/src-tauri/tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Build frontend
        run: |
          cd frontend
          bun install --silent
          bun run build

      - name: Build Tauri (Linux)
        run: |
          cd frontend
          bun run tauri build

      - name: List build artifacts
        run: |
          echo "=== Linux Bundle ==="
          find frontend/src-tauri/target/release/bundle -type f -ls 2>/dev/null || echo "No bundle found"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux
          path: |
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.rpm
            frontend/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn

  # ── Windows Build ─────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
        shell: bash

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -q -r requirements.txt pyinstaller
          pyinstaller --onefile --name hostwise-backend `
            --add-data "app;app" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=aiosqlite `
            --hidden-import=sqlalchemy.dialects.sqlite `
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --collect-all app `
            --collect-all aiosqlite `
            --noconsole `
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          $TargetTriple = (rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s+", "" }).Trim()
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe "frontend\src-tauri\binaries\hostwise-backend-${TargetTriple}.exe"

      - name: Configure Tauri for production
        run: |
          $cfg = Get-Content frontend\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name externalBin -Value @("binaries/hostwise-backend")
          $cfg.bundle | Add-Member -Force -MemberType NoteProperty -Name resources -Value @("binaries/*")
          $cfg | ConvertTo-Json -Depth 10 | Set-Content frontend\src-tauri\tauri.conf.json

      - name: Build frontend
        run: |
          cd frontend
          bun install --silent
          bun run build

      - name: Build Tauri (Windows)
        run: |
          cd frontend
          bun run tauri build

      - name: List build artifacts
        run: |
          echo "=== Windows Bundle ==="
          Get-ChildItem -Recurse -Path frontend\src-tauri\target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: |
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

  # ── Lint & Check ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Python lint
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q ruff
          ruff check app/ --no-fix || true

      - name: Frontend lint
        run: |
          cd frontend
          bun install --silent
          bun run lint || true

  # ── Release (version tags only) ────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]

    permissions:
      contents: write

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: hostwise-linux
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: hostwise-windows
          path: artifacts/windows

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### HostWise v${VERSION}" > release-notes.md
          echo "" >> release-notes.md
          echo "See the [changelog](../../blob/main/CHANGELOG.md) for details." >> release-notes.md
          echo "" >> release-notes.md
          echo "## 📦 Downloads" >> release-notes.md
          echo "" >> release-notes.md

          # List Linux artifacts
          echo "### Linux" >> release-notes.md
          for f in artifacts/linux/*; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`${name}\` (${size})" >> release-notes.md
          done

          # List Windows artifacts
          echo "" >> release-notes.md
          echo "### Windows" >> release-notes.md
          for f in artifacts/windows/*; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`${name}\` (${size})" >> release-notes.md
          done

          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/linux/*
            artifacts/windows/*
          fail_on_unmatched_files: false
