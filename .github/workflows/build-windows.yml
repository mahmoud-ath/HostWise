name: Build Windows

# Build the HostWise desktop installer for Windows.
# Run manually, or automatically when a `v*` tag is pushed.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install backend deps + PyInstaller
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      # NOTE: WeasyPrint PDF export needs GTK/Pango runtime libs on Windows;
      # the bundled app falls back to the print view if they are absent.
      - name: Build Tauri installer (NSIS)
        working-directory: frontend
        run: bunx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
