name: Build Windows

# Legacy per-OS build (manual only). Releases are now produced by the
# consolidated production pipeline: .github/workflows/release.yml.
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      - name: Build Tauri installer (NSIS)
        working-directory: frontend
        run: bunx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
