name: Build Linux

# Legacy per-OS build (manual only). Releases are now produced by the
# consolidated production pipeline: .github/workflows/release.yml.
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Tauri + WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2 libgdk-pixbuf-2.0-0 \
            patchelf libfuse2

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm hostwise-backend.spec

      - name: Bundle backend into Tauri resources
        run: |
          mkdir -p frontend/src-tauri/resources/hostwise-backend
          cp -r backend/dist/hostwise-backend/. frontend/src-tauri/resources/hostwise-backend/

      - name: Install frontend deps
        working-directory: frontend
        run: bun install

      - name: Build Tauri AppImage + deb
        working-directory: frontend
        env:
          # linuxdeploy (bundled by Tauri for AppImage) uses an old strip that
          # chokes on the .relr.dyn sections of Ubuntu 24.04's glibc. Skip its
          # strip pass; --verbose surfaces its (otherwise swallowed) stderr.
          NO_STRIP: "true"
        run: bunx tauri build --bundles appimage,deb --verbose

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-appimage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true
