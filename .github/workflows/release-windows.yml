# ═══════════════════════════════════════════════════════════
# HostWise — Windows Release Pipeline (Standalone)
# ═══════════════════════════════════════════════════════════
# Builds the Tauri desktop app for Windows only.
# Can be triggered manually or on push to a v*-win tag.
# ═══════════════════════════════════════════════════════════

name: Release (Windows)

on:
  push:
    tags:
      - "v*-win"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        shell: pwsh
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -q -r requirements.txt pyinstaller
          pyinstaller --onefile --name hostwise-backend `
            --add-data "app;app" `
            --hidden-import=uvicorn.logging `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http.auto `
            --hidden-import=aiosqlite `
            --hidden-import=sqlalchemy.dialects.sqlite `
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite `
            --hidden-import=pydantic `
            --hidden-import=pydantic_settings `
            --collect-all app `
            --collect-all aiosqlite `
            --noconsole `
            --noupx `
            --strip `
            --clean `
            --runtime-tmpdir "%APPDATA%\hostwise\runtime" `
            launcher.py

      - name: Prepare backend binary for Tauri
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s+", "" }).Trim()
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries | Out-Null
          Copy-Item backend\dist\hostwise-backend.exe "frontend\src-tauri\binaries\hostwise-backend-${TargetTriple}.exe"

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Install WiX toolset (for MSI bundling)
        shell: pwsh
        continue-on-error: true
        run: |
          $wixDir = "$env:ProgramFiles\WiX Toolset v3.14\bin"
          $wixRoot = "$env:ProgramFiles\WiX Toolset v3.14"
          $wixZip = "$env:TEMP\wix314.zip"
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"

          if (-not (Test-Path "$wixDir\candle.exe")) {
            Write-Host "Downloading WiX 3.14..."
            $retries = 0
            $downloaded = $false
            while ($retries -lt 3 -and -not $downloaded) {
              try {
                Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -TimeoutSec 180 -UseBasicParsing
                $downloaded = $true
              } catch {
                $retries++
                Write-Warning "Download failed (attempt $retries/3): $_"
                Start-Sleep -Seconds 15
              }
            }
            if ($downloaded) {
              New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
              Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
              Remove-Item $wixZip -Force
              Write-Host "WiX 3.14 installed to $wixDir"
            } else {
              Write-Warning "Failed to download WiX after 3 attempts"
            }
          } else {
            Write-Host "WiX 3.14 already present at $wixDir"
          }
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "WIX=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Code sign the backend binary (optional)
        shell: pwsh
        continue-on-error: true
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX) {
            Write-Host "No code signing certificate found — skipping"
            exit 0
          }
          $pfxPath = "$env:TEMP\cert.pfx"
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          & "signtool" sign /fd SHA256 /a /f $pfxPath /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 frontend\src-tauri\target\release\hostwise.exe

      - name: Build Tauri (msi + nsis)
        shell: pwsh
        run: |
          cd frontend
          if (Get-Command "candle.exe" -ErrorAction SilentlyContinue) {
            Write-Host "WiX found — building MSI + NSIS"
            bun run tauri build --bundles msi,nsis
          } else {
            Write-Warning "WiX not available, falling back to NSIS only"
            bun run tauri build --bundles nsis
          }

      - name: Code sign the installer (optional)
        shell: pwsh
        continue-on-error: true
        env:
          CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX) { exit 0 }
          $pfxPath = "$env:TEMP\cert.pfx"
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $installers = Get-ChildItem -Path frontend\src-tauri\target\release\bundle -Recurse -Include *.msi,*.exe
          foreach ($installer in $installers) {
            & "signtool" sign /fd SHA256 /a /f $pfxPath /p $env:CODESIGN_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          }

      - name: List bundle contents
        shell: pwsh
        run: |
          Write-Host "=== Windows Bundle ==="
          Get-ChildItem -Recurse -Path frontend\src-tauri\target\release\bundle -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostwise-windows
          path: frontend/src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '-win$', ''
          $notes = "release-notes.md"
          @"
## HostWise Windows $version

### 📦 Downloads

### Windows
- MSI Installer (in artifacts)
- NSIS Setup (in artifacts)
"@ | Out-File -FilePath $notes
          echo "notes_file=$notes" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise Windows ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
