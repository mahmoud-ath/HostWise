# ═══════════════════════════════════════════════════════════
# HostWise — CI Pipeline
# ═══════════════════════════════════════════════════════════
# Runs lint & build checks on every push/PR to main.
# ═══════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  # ── Lint & Type Check ─────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clear bun cache (avoid tarball extraction issues)
        run: |
          rm -rf ~/.bun/install/cache
          rm -rf app/frontend/node_modules

      - name: Install frontend dependencies
        run: |
          cd app/frontend
          bun install --frozen-lockfile

      - name: Frontend lint (Next.js)
        run: |
          cd app/frontend
          bun run lint || echo "Lint warnings found (non-blocking)"

  # ── Rust Backend (native) ─────────────────────────────
  backend:
    name: Rust Backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust backend — fmt, clippy, test
        working-directory: app/backend
        run: |
          cargo fmt --check || echo "fmt issues (non-blocking)"
          cargo clippy --all-targets -- -D warnings || echo "Clippy warnings (non-blocking)"
          cargo test

  # ── Frontend Build (smoke test) ───────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clear bun cache (avoid tarball extraction issues)
        run: |
          rm -rf ~/.bun/install/cache
          rm -rf app/frontend/node_modules

      - name: Install dependencies
        run: |
          cd app/frontend
          bun install --frozen-lockfile

      - name: Build Next.js
        run: |
          cd app/frontend
          bun run build
