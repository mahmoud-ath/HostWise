# ═══════════════════════════════════════════════════════════
# HostWise — Linux Release Pipeline
# ═══════════════════════════════════════════════════════════
# Builds the Tauri desktop app for Linux only.
# Triggered by tags: v*-linux
# ═══════════════════════════════════════════════════════════

name: Release (Linux)

on:
  workflow_call:
  push:
    tags:
      - "v*-linux"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Build Python backend (PyInstaller)
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt "pyinstaller>=6.10,<7"
          pyinstaller \
            --onefile \
            --name "hostwise-backend" \
            --add-data "app:app" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=aiosqlite \
            --hidden-import=sqlalchemy.dialects.sqlite \
            --hidden-import=sqlalchemy.dialects.sqlite.aiosqlite \
            --hidden-import=pydantic \
            --hidden-import=pydantic_settings \
            --collect-all app \
            --collect-all aiosqlite \
            --noconsole \
            --noupx \
            --strip \
            launcher.py

      - name: Prepare backend binary for Tauri
        run: |
          TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/hostwise-backend "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"
          chmod +x "frontend/src-tauri/binaries/hostwise-backend-${TARGET_TRIPLE}"

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          bun run build

      - name: Build Tauri (deb + appimage + rpm)
        run: |
          cd frontend
          bun run tauri build --bundles deb,appimage,rpm

      - name: List bundle contents
        run: |
          echo "=== Linux Bundle ==="
          find frontend/src-tauri/target/release/bundle -type f -ls 2>/dev/null || echo "No bundle files found"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME%%-linux}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          NOTES="release-notes.md"
          printf "## HostWise Linux ${VERSION}\n\n### Downloads\n\n### Linux\n" > "$NOTES"
          find frontend/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | while read -r f; do
            name=$(basename "$f")
            size=$(du -h "$f" | cut -f1)
            echo "- \`${name}\` (${size})" >> "$NOTES"
          done
          echo "notes_file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HostWise Linux ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
