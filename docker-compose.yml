# HostWise — Docker Compose
# Modular Monolith MVP Architecture
# No Kubernetes. No microservices. No Kafka. Just what we need.

services:
  # ── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hostwise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostwise
      POSTGRES_PASSWORD: hostwise
      POSTGRES_DB: hostwise
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostwise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: hostwise-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://hostwise:hostwise@db:5432/hostwise
      DATABASE_URL_SYNC: postgresql+psycopg2://hostwise:hostwise@db:5432/hostwise
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: hostwise-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: HostWise
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: bun run dev

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
