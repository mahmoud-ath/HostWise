[package]
name = "hostwise"
version = "0.7.0"
description = "HostWise — vacation rental financial intelligence (desktop shell)"
authors = ["HostWise"]
edition = "2021"
rust-version = "1.77.2"

# The app's Rust library exposes the Tauri app; the binary is a thin wrapper.
[lib]
name = "hostwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostwise-backend = { path = "../../backend-rs" }
anyhow = "1"
axum = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
