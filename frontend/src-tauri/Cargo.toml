[package]
name = "hostwise"
version = "0.6.0"
description = "HostWise — vacation rental financial intelligence (desktop shell)"
authors = ["HostWise"]
edition = "2021"
rust-version = "1.77.2"

# The app's Rust library exposes the Tauri app; the binary is a thin wrapper.
[lib]
name = "hostwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
